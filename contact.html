<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Pixl Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23c1443f'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial' font-weight='900' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="contact-hero">
      <div class="container">
        <h1 id="contact-heading">LET'S TALK</h1>
        <p id="contact-text"></p>
      </div>
    </section>

    <section class="container contact-wrap">
      <div class="contact-info" id="contact-info"></div>
      <form class="contact-form" id="contact-form">
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
        <input type="text" name="company" placeholder="Company (optional)">
        <textarea name="message" placeholder="Tell us about your project..." required></textarea>
        <button type="submit" class="btn btn-primary">Send message</button>
        <p class="form-note" id="form-note">This form sends via your email client. To collect submissions directly, connect a form service like Formspree or EmailJS.</p>
      </form>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/main.js"></script>
  <script>
    PixlData.load().then(data => {
      applyTheme(data);
      renderHeader(data);
      renderFooter(data);
      renderContactInfo(data);
      document.getElementById('contact-heading').textContent = data.contact?.heading || "LET'S TALK";
      document.getElementById('contact-text').textContent = data.contact?.text || '';

      document.getElementById('contact-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const subject = encodeURIComponent(`New project inquiry from ${f.get('name')}`);
        const body = encodeURIComponent(
          `Name: ${f.get('name')}\nEmail: ${f.get('email')}\nCompany: ${f.get('company')}\n\n${f.get('message')}`
        );
        window.location.href = `mailto:${data.site.email}?subject=${subject}&body=${body}`;
      });
    });
  </script>
</body>
</html>
