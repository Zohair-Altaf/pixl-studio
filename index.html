<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixl Studio | Creative &amp; Digital Design Agency</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23c1443f'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial' font-weight='900' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero" id="hero-section"></section>

    <div id="quote1-section"></div>

    <section class="intro-section" id="about" style="scroll-margin-top:100px;"></section>

    <section class="work-section" id="work-wrap">
      <div id="work-section"></div>
    </section>

    <div id="quote2-section"></div>

    <section class="team-section" id="team-section" style="scroll-margin-top:100px;"></section>

    <section class="clients-section" id="clients-section"></section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/main.js"></script>
  <script>
    PixlData.load().then(data => {
      applyTheme(data);
      renderHeader(data);
      renderHero(data);
      renderQuote('quote1-section', data.quote1, false);
      renderIntro(data);
      renderWork(data, 4);
      renderQuote('quote2-section', data.quote2, true);
      renderTeam(data);
      renderClients(data);
      renderFooter(data);
    });
  </script>
</body>
</html>
