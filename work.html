<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work | Pixl Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23c1443f'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial' font-weight='900' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="work-page-hero">
      <div class="container">
        <h1 id="work-page-title">OUR WORK</h1>
        <div class="filter-row" id="filter-row"></div>
      </div>
    </section>

    <section class="work-section" style="padding-top:0;">
      <div class="container">
        <div class="portfolio-grid" id="work-grid"></div>
      </div>
    </section>

    <section class="testimonials-section" id="testimonials-section"></section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/main.js"></script>
  <script>
    let allItems = [];
    function draw(items) {
      document.getElementById('work-grid').innerHTML = items.length
        ? items.map(portfolioCard).join('')
        : '<p class="empty-note">No projects in this category yet.</p>';
    }
    PixlData.load().then(data => {
      applyTheme(data);
      renderHeader(data);
      renderFooter(data);
      renderTestimonials(data);

      allItems = data.portfolio || [];
      const cats = ['ALL', ...new Set(allItems.map(p => p.category))];
      document.getElementById('filter-row').innerHTML = cats.map((c, i) =>
        `<button class="filter-btn ${i === 0 ? 'active' : ''}" data-cat="${c}">${c}</button>`
      ).join('');
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const cat = btn.dataset.cat;
          draw(cat === 'ALL' ? allItems : allItems.filter(p => p.category === cat));
        });
      });
      draw(allItems);
    });
  </script>
</body>
</html>
